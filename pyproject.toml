[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcriber"
version = "0.0.0"
description = "Offline, multilingual (es/en/ja) conversation transcription with speaker labels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mario" }]
dependencies = [
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.1",
    "torch>=2.1",
    "torchaudio>=2.1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
transcribe = "cli.main:main"

[tool.setuptools]
packages = ["transcriber", "transcriber.backends", "cli", "gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
